<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <filter id="ember-glow" x="10" y="0" width="12" height="12" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1" result="blur" />
