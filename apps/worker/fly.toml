app = "pyra-worker-staging"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"
  build_target = "runner"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  SCHEDULER_INTERVAL_MS = "60000"
  WORKER_CONCURRENCY = "10"
  FAILURE_ALERT_THRESHOLD = "3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false  # Worker must always be on — never sleeps
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
