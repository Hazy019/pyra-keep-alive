name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  # ─── Deploy web app to Vercel preview ───────────────────────────────────
  deploy-web-staging:
    name: Deploy Web (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel (staging)
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::notice::VERCEL_TOKEN secret is not configured in GitHub repository secrets. Skipping Vercel staging deployment."
            exit 0
          fi

          SCOPE_ARG=""
          if [ -n "${{ secrets.VERCEL_SCOPE }}" ]; then
            SCOPE_ARG="--scope ${{ secrets.VERCEL_SCOPE }}"
          fi

          pnpm --filter @pyra/web exec vercel deploy \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            $SCOPE_ARG \
            --env NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY }}" \
            --env NEXT_PUBLIC_APP_URL="${{ vars.STAGING_APP_URL }}" \
            --env NEXT_PUBLIC_TURNSTILE_SITE_KEY="${{ secrets.STAGING_TURNSTILE_SITE_KEY }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─── Deploy worker to Fly.io staging ────────────────────────────────────
  deploy-worker-staging:
    name: Deploy Worker (Staging)
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy worker to Fly.io staging
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::notice::FLY_API_TOKEN secret is not configured in GitHub repository secrets. Skipping Fly.io staging deployment."
            exit 0
          fi
          flyctl deploy \
            --app pyra-worker-staging \
            --config apps/worker/fly.toml \
            --remote-only \
            --wait-timeout 120
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ─── Production deploy (manual approval gate) ────────────────────────────
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [deploy-web-staging, deploy-worker-staging]
    environment: production  # Requires manual approval in GitHub Environments UI

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy worker to Fly.io production
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN_PROD }}" ]; then
            echo "::notice::FLY_API_TOKEN_PROD secret is not configured. Skipping Fly.io production deployment."
            exit 0
          fi
          flyctl deploy \
            --app pyra-worker-prod \
            --config apps/worker/fly.toml \
            --remote-only \
            --wait-timeout 180
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROD }}

      - name: Promote Vercel deployment to production
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN_PROD }}" ]; then
            echo "::notice::VERCEL_TOKEN_PROD secret is not configured. Skipping Vercel production deployment."
            exit 0
          fi

          SCOPE_ARG=""
          if [ -n "${{ secrets.VERCEL_SCOPE_PROD }}" ]; then
            SCOPE_ARG="--scope ${{ secrets.VERCEL_SCOPE_PROD }}"
          fi

          pnpm --filter @pyra/web exec vercel promote \
            --token "${{ secrets.VERCEL_TOKEN_PROD }}" \
            $SCOPE_ARG
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_PROD }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PROD }}
