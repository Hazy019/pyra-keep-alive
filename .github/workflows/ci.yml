name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.0
  NODE_VERSION: 22

jobs:
  # ─── Step 1: Lint + typecheck ─────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Root package.json now uses `pnpm -r --if-present lint` which skips
      # packages that have no lint script (e.g. @pyra/db) instead of hard-erroring.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ─── Step 2: Unit & Integration Tests ─────────────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:test@localhost:5432/pyra_test
      DATABASE_URL_UNPOOLED: postgres://postgres:test@localhost:5432/pyra_test
      NODE_ENV: test
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= # Test-only 32 bytes

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm db:migrate

      - name: Unit & integration tests
        run: pnpm test

  # ─── Step 3: SAST (CodeQL) ────────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    needs: lint-typecheck
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - uses: github/codeql-action/autobuild@v3

      - uses: github/codeql-action/analyze@v3

  # ─── Step 4: Dependency audit ─────────────────────────────────────────────
  audit:
    name: Dependency Audit (Production)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Production Dependencies
        run: pnpm audit --prod --audit-level critical

  # ─── Step 5: Worker Build ─────────────────────────────────────────────────
  worker-build:
    name: Worker Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build worker
        run: pnpm --filter @pyra/worker build

  # ─── Step 6: Web Build ────────────────────────────────────────────────────
  # Uploads the compiled .next directory as a GitHub artifact so Playwright
  # can download and serve it — zero double-compilation, same binary guaranteed.
  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: [test, audit]
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_APP_URL: https://pyra.dev
      CLERK_SECRET_KEY: sk_test_placeholder
      # Placeholder DB URL: Next.js build never opens a real DB connection.
      # getSecrets() only throws when route handlers are *invoked*, not at build.
      DATABASE_URL: postgres://placeholder:placeholder@localhost/placeholder
      DATABASE_URL_UNPOOLED: postgres://placeholder:placeholder@localhost/placeholder
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: re_placeholder
      TURNSTILE_SECRET_KEY: placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web application
        run: pnpm --filter @pyra/web build

      # Upload compiled .next so Playwright downloads it — no second build.
      - name: Upload .next build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: apps/web/.next
          retention-days: 1
          if-no-files-found: error

  # ─── Step 7: Playwright E2E Suite ─────────────────────────────────────────
  # Downloads the pre-built .next artifact from web-build — runs against the
  # identical binary that passed compilation. Auth-gated E2E flows check
  # CLERK_KEYS_AVAILABLE and skip gracefully when no real Clerk secrets exist.
  #
  # To enable auth-gated E2E tests, add these to GitHub → Settings → Secrets:
  #   STAGING_CLERK_PUBLISHABLE_KEY  (e.g. pk_test_xxxxx from Clerk dashboard)
  #   STAGING_CLERK_SECRET_KEY       (e.g. sk_test_xxxxx from Clerk dashboard)
  playwright:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    needs: web-build
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY || 'pk_test_placeholder' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY || 'sk_test_placeholder' }}
      DATABASE_URL: postgres://postgres:test@localhost:5432/pyra_test
      DATABASE_URL_UNPOOLED: postgres://postgres:test@localhost:5432/pyra_test
      ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: placeholder
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: re_placeholder
      TURNSTILE_SECRET_KEY: placeholder
      CI: true
      # Read by E2E specs: when false, tests requiring a real Clerk session skip.
      CLERK_KEYS_AVAILABLE: ${{ secrets.STAGING_CLERK_PUBLISHABLE_KEY != '' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pyra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        run: pnpm db:migrate

      # Download the exact binary produced in web-build — avoids double compile.
      - name: Download .next build artifact
        uses: actions/download-artifact@v4
        with:
          name: next-build-${{ github.sha }}
          path: apps/web/.next

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts uses 'pnpm start' in CI which serves the pre-built app.
      - name: Run Playwright E2E tests
        run: pnpm --filter @pyra/web test:e2e

  # ─── Step 8: CI Required Checks Aggregator ────────────────────────────────
  ci-status:
    name: CI Required Checks Gate
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test, codeql, audit, worker-build, web-build, playwright]
    if: always()
    steps:
      - name: Evaluate status of all required checks
        run: |
          declare -A RESULTS
          RESULTS["lint-typecheck"]="${{ needs.lint-typecheck.result }}"
          RESULTS["test"]="${{ needs.test.result }}"
          RESULTS["codeql"]="${{ needs.codeql.result }}"
          RESULTS["audit"]="${{ needs.audit.result }}"
          RESULTS["worker-build"]="${{ needs.worker-build.result }}"
          RESULTS["web-build"]="${{ needs.web-build.result }}"
          RESULTS["playwright"]="${{ needs.playwright.result }}"

          FAILED=()
          for JOB in "${!RESULTS[@]}"; do
            STATUS="${RESULTS[$JOB]}"
            echo "  ${JOB} -> ${STATUS}"
            # 'skipped' = soft pass (concurrency cancellation on stale PRs)
            # 'failure' / 'cancelled' = hard failure — blocks merge
            if [[ "${STATUS}" == "failure" || "${STATUS}" == "cancelled" ]]; then
              FAILED+=("${JOB} (${STATUS})")
            fi
          done

          if [ ${#FAILED[@]} -gt 0 ]; then
            echo ""
            echo "::error::The following required CI checks failed or were cancelled:"
            for F in "${FAILED[@]}"; do
              echo "  x ${F}"
            done
            exit 1
          fi

          echo "All required CI checks passed."
