name: Keep-Alive Cron Sweep

# This workflow is a FALLBACK cron trigger for the keep-alive sweep.
#
# Primary trigger: Vercel native cron (apps/web/vercel.json) — runs every 5 minutes
# directly from Vercel with CRON_SECRET available as a platform env var. No GitHub
# Secret needed, no network egress from GitHub runners.
#
# This GitHub Actions workflow fires every 10 minutes as a secondary watchdog.
# If the Vercel deployment is healthy, Vercel cron is already handling it.
# This workflow acts as a belt-and-suspenders safety net.
#
# REQUIRED GitHub Secrets (Settings → Secrets and variables → Actions → Secrets):
#   CRON_SECRET  — must match the CRON_SECRET env var set in Vercel project settings
#
# REQUIRED GitHub Variables (Settings → Secrets and variables → Actions → Variables):
#   APP_URL      — e.g. https://pyra-keep-alive-web.vercel.app  (no trailing slash)

on:
  schedule:
    # Every 10 minutes — GitHub Actions has up to ~15 min scheduling delay under
    # load, so 10-min intervals are a realistic minimum. The Vercel native cron
    # at 5-min intervals is the authoritative primary trigger.
    - cron: '*/10 * * * *'
  workflow_dispatch: # Manual trigger from GitHub UI for ad-hoc testing

concurrency:
  group: cron-sweep
  cancel-in-progress: false # Never cancel a running sweep mid-flight

jobs:
  sweep:
    name: Execute Keep-Alive Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Validate CRON_SECRET is configured
        # Fail early with a clear message rather than sending a blank Bearer token.
        # Use env: block — GitHub Actions masks secrets in expressions; using env: is
        # the canonical way to pass secrets into shell scripts.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::CRON_SECRET GitHub Secret is not configured."
            echo "::error::Go to: Settings → Secrets and variables → Actions → New repository secret"
            echo "::error::Name: CRON_SECRET  |  Value: <your CRON_SECRET from Vercel project settings>"
            exit 1
          fi
          echo "CRON_SECRET is configured (length: ${#CRON_SECRET} chars)"

      - name: Resolve target URL
        id: resolve_url
        run: |
          # Prefer explicit APP_URL variable; fall back to the known Vercel URL.
          # NOTE: Set the APP_URL GitHub Variable (Settings → Secrets and variables
          # → Actions → Variables) to your actual Vercel deployment URL.
          BASE_URL="${{ vars.APP_URL || 'https://pyra-keep-alive-web.vercel.app' }}"
          # Strip trailing slash defensively
          BASE_URL="${BASE_URL%/}"
          TARGET_URL="${BASE_URL}/api/cron/sweep"
          echo "target_url=${TARGET_URL}" >> "$GITHUB_OUTPUT"
          echo "Cron sweep target: ${TARGET_URL}"

      - name: Trigger keep-alive sweep
        # Pass CRON_SECRET via env: (not expression interpolation) to prevent secret masking issues.
        #
        # FIX: We write the response body to a temp file and capture ONLY the HTTP status
        # code on stdout. The old approach embedded "\nHTTP_STATUS:%{http_code}" inside the
        # body stream and parsed it with sed+tail+cut — this broke whenever the body
        # (HTML 404 pages, JSON with colons, multi-line payloads) caused the sentinel line
        # to not be the actual last line, producing an empty or garbage HTTP_STATUS and
        # failing the job even when the endpoint responded 200 OK.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          TARGET_URL="${{ steps.resolve_url.outputs.target_url }}"

          echo "Sending cron sweep request to: ${TARGET_URL}"

          RESPONSE_FILE=$(mktemp)

          # --output writes body to file; --write-out "%{http_code}" prints ONLY the
          # status code to stdout — completely separate streams, zero parsing ambiguity.
          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --max-time 60 \
            --output "${RESPONSE_FILE}" \
            --write-out "%{http_code}" \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "User-Agent: GitHub-Actions-CronSweep/2.0 (+https://github.com/${{ github.repository }})" \
            --header "X-GitHub-Run-Id: ${{ github.run_id }}" \
            "${TARGET_URL}")

          HTTP_BODY=$(cat "${RESPONSE_FILE}")
          rm -f "${RESPONSE_FILE}"

          echo "Response status : ${HTTP_STATUS}"
          echo "Response body   : ${HTTP_BODY}"

          if [ "${HTTP_STATUS}" -eq 401 ]; then
            echo "::error::HTTP 401 — CRON_SECRET mismatch. Verify the secret in GitHub matches CRON_SECRET in Vercel project settings."
            echo "::error::Body: ${HTTP_BODY}"
            exit 1
          fi

          if [ "${HTTP_STATUS}" -eq 404 ]; then
            echo "::error::HTTP 404 — /api/cron/sweep not found at ${TARGET_URL}"
            echo "::error::Check that APP_URL GitHub Variable (Settings → Secrets and variables → Actions → Variables)"
            echo "::error::is set to your actual production URL, e.g. https://your-app.vercel.app (no trailing slash)."
            echo "::error::Body (may be HTML 404 page): ${HTTP_BODY}"
            exit 1
          fi

          if [ "${HTTP_STATUS}" -eq 500 ]; then
            echo "::error::HTTP 500 — Server error in /api/cron/sweep. Full body:"
            echo "::error::${HTTP_BODY}"
            echo "::error::Check Vercel Function logs at: https://vercel.com/dashboard"
            exit 1
          fi

          # Accept any 2xx response (200, 201, 204, etc.)
          if [ "${HTTP_STATUS}" -lt 200 ] || [ "${HTTP_STATUS}" -ge 300 ]; then
            echo "::error::Cron sweep failed with unexpected HTTP status ${HTTP_STATUS}"
            echo "::error::Body: ${HTTP_BODY}"
            exit 1
          fi

          echo "Sweep completed successfully."
