version: 2
updates:
  # ─── Root devDependencies ──────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, security]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        patterns: ["*"]

  # ─── Web app ───────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, web]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      web-dependencies:
        patterns: ["*"]

  # ─── Worker ────────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /apps/worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, worker]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      worker-dependencies:
        patterns: ["*"]

  # ─── Shared package ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/shared
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, shared]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      shared-dependencies:
        patterns: ["*"]

  # ─── DB package ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/db
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, db]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      db-dependencies:
        patterns: ["*"]

  # ─── GitHub Actions ────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies, ci]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions:
        patterns: ["*"]
